name: Generate Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"  # Atualiza todos os dias à meia-noite UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (light)
        uses: Platane/snk@v3
        with:
          github_user_name: itsfernandesb
          outputs: dist/github-contribution-grid-snake.svg
          snake_color: "#00CED1"
          background: "#FFFFFF"
          grid_color: "#D3D3D3"
          apple_color: "#9370DB"

      - name: Generate Snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: itsfernandesb
          outputs: dist/github-contribution-grid-snake-dark.svg
          snake_color: "#C084FC"
          background: "#0D1117"
          grid_color: "#30363D"
          apple_color: "#22D3EE"

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
